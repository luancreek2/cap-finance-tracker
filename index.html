<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cap - Finance Tracker</title>
    <style>
      /* ========================================================================== */
      /* 1. Theme, base styles, and shared layout                                   */
      /* ========================================================================== */
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #f3f3f7;
        --card: #fff;
        --tx: #111;
        --mut: #777;
        --line: #e6e6ec;
        --g: #16a34a;
        --r: #e11d48;
        --ac: #111;
        --ac-t: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0a0a0c;
          --card: #17171b;
          --tx: #f5f5f7;
          --mut: #9a9aa3;
          --line: #26262c;
          --g: #4ade80;
          --r: #fb7185;
          --ac: #fff;
          --ac-t: #111;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0a0a0c;
        --card: #17171b;
        --tx: #f5f5f7;
        --mut: #9a9aa3;
        --line: #26262c;
        --g: #4ade80;
        --r: #fb7185;
        --ac: #fff;
        --ac-t: #111;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.4 -apple-system,
          "Segoe UI",
          Inter,
          Roboto,
          sans-serif;
        padding-bottom: 90px;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 0 16px;
      }
      nav {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        display: flex;
        justify-content: center;
        padding: 10px 0;
      }
      nav div {
        display: flex;
        gap: 2px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 4px;
        overflow-x: auto;
        max-width: 100%;
      }
      nav button {
        border: 0;
        background: none;
        color: var(--tx);
        padding: 8px 14px;
        border-radius: 99px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      nav button.on {
        background: var(--ac);
        color: var(--ac-t);
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--mut);
        font-weight: 600;
      }
      h1 {
        font-size: 30px;
        margin: 2px 0 6px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      .card {
        background: var(--card);
        border-radius: 20px;
        padding: 16px;
        border: 1px solid var(--line);
        margin-bottom: 14px;
      }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr 1fr;
      }
      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .big {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .g {
        color: var(--g);
      }
      .r {
        color: var(--r);
      }
      .m {
        color: var(--mut);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .stats .card {
        margin: 0;
        padding: 12px;
      }
      .stats b {
        font-size: 17px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .row:first-of-type {
        border-top: 0;
      }
      .ico {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--bg);
        display: grid;
        place-items: center;
        font-size: 18px;
        flex: none;
      }
      .row .f {
        flex: 1;
        min-width: 0;
      }
      .row small {
        color: var(--mut);
        display: block;
      }
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 110px;
        margin-top: 8px;
      }
      .bars i {
        flex: 1;
        background: var(--line);
        border-radius: 4px;
      }
      .bars i.t {
        background: var(--ac);
      }
      .pill {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--tx);
        border-radius: 99px;
        padding: 6px 14px;
        font: inherit;
        cursor: pointer;
      }
      .pill.on {
        background: var(--ac);
        color: var(--ac-t);
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 11px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--tx);
        font: inherit;
        margin-bottom: 10px;
      }
      textarea {
        min-height: 280px;
        resize: vertical;
      }
      .btn {
        background: var(--ac);
        color: var(--ac-t);
        border: 0;
        border-radius: 12px;
        padding: 11px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .btn.s {
        background: var(--bg);
        color: var(--tx);
        border: 1px solid var(--line);
      }
      .cards {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
      .cc {
        aspect-ratio: 1.586;
        border-radius: 18px;
        color: #fff;
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 22px #0003;
        cursor: pointer;
      }
      .cc:before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(135deg, #fff1 0 6px, #0000 6px 14px);
      }
      .cc > * {
        position: relative;
      }
      .cc .b {
        font-weight: 800;
        font-size: 17px;
        letter-spacing: 0.01em;
      }
      .cc .chip {
        width: 38px;
        height: 28px;
        border-radius: 6px;
        background: linear-gradient(135deg, #f5e6b8, #c9a95c);
      }
      .cc .bt {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      .cc .v {
        font-size: 22px;
        font-weight: 700;
      }
      .cc small {
        opacity: 0.85;
        display: block;
      }
      .mc {
        display: inline-flex;
      }
      .mc i {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #eb001b;
      }
      .mc i + i {
        background: #f79e1b;
        margin-left: -9px;
        opacity: 0.9;
      }
      .visa {
        font: italic 800 18px serif;
      }
      .bar {
        height: 8px;
        background: var(--line);
        border-radius: 9px;
        overflow: hidden;
        margin-top: 6px;
      }
      .bar b {
        display: block;
        height: 100%;
        background: var(--g);
      }
      .bar.o b {
        background: var(--r);
      }
      /* 2. Sheets, forms, cards, and calendar components */
      #sheet {
        position: fixed;
        inset: 0;
        background: #0007;
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 20;
      }
      #sheet.open {
        display: flex;
      }
      #sheet > div {
        background: var(--card);
        width: 100%;
        max-width: 520px;
        border-radius: 24px 24px 0 0;
        padding: 20px;
        max-height: 88vh;
        overflow: auto;
      }
      .fab {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        z-index: 6;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 14px 22px;
        box-shadow: 0 8px 24px #0003;
        color: var(--tx);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .pick {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 12px;
      }
      .pick .cc {
        padding: 10px;
        font-size: 12px;
        box-shadow: none;
        outline: 3px solid transparent;
      }
      .pick .cc.sel {
        outline-color: var(--g);
      }
      .pick .cc .v {
        font-size: 13px;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
      }
      .cal .h {
        font-size: 11px;
        color: var(--mut);
        text-align: center;
      }
      .cal .d {
        min-height: 64px;
        background: var(--bg);
        border-radius: 8px;
        padding: 3px;
        font-size: 10px;
        overflow: hidden;
        cursor: pointer;
      }
      .cal .d.t > b {
        background: var(--ac);
        color: var(--ac-t);
        border-radius: 99px;
        padding: 0 5px;
      }
      .cal .e {
        display: block;
        border-radius: 3px;
        padding: 0 3px;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 9.5px;
      }
      .e.o {
        background: #e11d4833;
      }
      .e.i {
        background: #16a34a33;
      }
      .e.s {
        background: #3b82f633;
      }
      .e.u {
        background: #f59e0b55;
      }
      @media (max-width: 600px) {
        .cal .d {
          min-height: 52px;
          padding: 2px;
        }
        .cal .e {
          font-size: 8px;
        }
      }
      :root {
        --yl: #a87b00;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --yl: #ffd60a;
        }
      }
      :root[data-theme="dark"] {
        --yl: #ffd60a;
      }
      .acal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }
      .acal > div {
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        min-height: 100px;
        padding: 3px;
        cursor: pointer;
        min-width: 0;
      }
      .acal .n {
        text-align: right;
        font-size: 15px;
        padding: 2px 3px;
      }
      .acal .n.t span {
        background: #ff453a;
        color: #fff;
        border-radius: 99px;
        display: inline-block;
        min-width: 26px;
        padding: 0 5px;
        line-height: 26px;
        text-align: center;
      }
      .acal .x .n {
        color: var(--mut);
      }
      .ap {
        display: flex;
        align-items: center;
        gap: 4px;
        border-radius: 6px;
        padding: 1px 5px;
        margin-top: 2px;
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ap:before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
      }
      .ap.o {
        background: #ff453a2e;
        color: #ff453a;
      }
      .ap.i {
        background: #30d1582e;
        color: #22a447;
      }
      .ap.s,
      .ap.u {
        background: #ffd60a2e;
        color: var(--yl);
      }
      @media (max-width: 600px) {
        .acal > div {
          min-height: 66px;
        }
        .ap {
          font-size: 9px;
          padding: 0 3px;
          gap: 2px;
        }
        .ap:before {
          width: 5px;
          height: 5px;
        }
        .acal .n {
          font-size: 12px;
        }
        .acal .n.t span {
          min-width: 20px;
          line-height: 20px;
        }
      }
      .cc .lg {
        display: flex;
        align-items: center;
        height: 28px;
      }
      .cc .lg img {
        height: 100%;
        width: auto;
        display: block;
      }
      .cc .lg.w {
        background: #fff;
        border-radius: 10px;
        padding: 3px 8px;
        height: 36px;
        box-sizing: border-box;
      }
      .pick .cc .lg {
        height: 18px;
      }
      .pick .cc .lg.w {
        height: 24px;
        padding: 2px 6px;
      }
      /* 3. Glass surfaces and visual effects */
      :root {
        --gl: #ffffff8c;
        --gb: #ffffffb3;
        --gon: #ffffffe0;
        --gsh: inset 0 1px 0 #ffffffd9, inset 0 -1px 0 #ffffff40, 0 10px 30px #1b1b3a1a;
        --b1: #7aa8ff66;
        --b2: #f2a6ff55;
        --b3: #8ff0d066;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --gl: #2c2c3666;
          --gb: #ffffff22;
          --gon: #ffffff2e;
          --gsh: inset 0 1px 0 #ffffff33, inset 0 -1px 0 #ffffff0d, 0 10px 30px #0008;
          --b1: #3b5bff4d;
          --b2: #a23bff40;
          --b3: #00c2a038;
        }
      }
      :root[data-theme="dark"] {
        --gl: #2c2c3666;
        --gb: #ffffff22;
        --gon: #ffffff2e;
        --gsh: inset 0 1px 0 #ffffff33, inset 0 -1px 0 #ffffff0d, 0 10px 30px #0008;
        --b1: #3b5bff4d;
        --b2: #a23bff40;
        --b3: #00c2a038;
      }
      body {
        background:
          radial-gradient(55% 40% at 10% 6%, var(--b1), transparent 70%),
          radial-gradient(50% 40% at 95% 16%, var(--b2), transparent 70%),
          radial-gradient(60% 50% at 70% 96%, var(--b3), transparent 70%), var(--bg);
        background-attachment: fixed;
      }
      .card,
      nav > div,
      .fab,
      #sheet > div,
      .dr {
        background: var(--gl);
        border: 1px solid var(--gb);
        box-shadow: var(--gsh);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        backdrop-filter: blur(24px) saturate(180%);
      }
      .card {
        border-radius: 24px;
      }
      nav button.on {
        background: var(--gon);
        color: var(--tx);
        box-shadow:
          inset 0 1px 0 #fff9,
          0 2px 8px #0002;
      }
      .pill,
      .btn.s,
      input,
      select,
      textarea {
        background: var(--gl);
        border: 1px solid var(--gb);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        backdrop-filter: blur(14px) saturate(160%);
      }
      .pill {
        box-shadow: inset 0 1px 0 #ffffff80;
      }
      .btn {
        box-shadow:
          inset 0 1px 0 #ffffff55,
          0 6px 16px #00000026;
      }
      .ico {
        background: var(--gon);
      }
      #sheet {
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }
      #sheet > div {
        border-radius: 30px 30px 0 0;
      }
      .cc {
        box-shadow:
          inset 0 1px 0 #ffffff99,
          inset 0 0 0 1px #ffffff26,
          0 10px 26px #0004;
      }
      .cc:after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(135deg, #ffffff59, #fff0 45%, #ffffff1f);
        pointer-events: none;
      }
      .dp {
        margin-bottom: 8px;
      }
      .dr {
        display: flex;
        justify-content: space-between;
        padding: 12px 14px;
        border-radius: 14px;
        margin-bottom: 6px;
        cursor: pointer;
      }
      .dg {
        display: none;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
        margin: 8px 0 10px;
      }
      .dg.open {
        display: grid;
      }
      .dg button {
        aspect-ratio: 1;
        border-radius: 50%;
        border: 1px solid var(--gb);
        background: var(--gl);
        color: var(--tx);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        padding: 0;
      }
      .dg button.on {
        background: var(--ac);
        color: var(--ac-t);
      }
      :root {
        --bg: #fff;
        --card: #f5f5f7;
        --line: #e4e4e7;
        --gl: #f5f5f7e6;
        --gb: #e4e4e7;
        --gon: #e9e9ec;
        --gsh: 0 1px 2px #0000000d;
        --b1: #0000;
        --b2: #0000;
        --b3: #0000;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #000;
          --card: #111113;
          --line: #26262a;
          --gl: #111113e6;
          --gb: #26262a;
          --gon: #26262a;
          --gsh: 0 1px 2px #000;
          --b1: #0000;
          --b2: #0000;
          --b3: #0000;
        }
      }
      :root[data-theme="dark"] {
        --bg: #000;
        --card: #111113;
        --line: #26262a;
        --gl: #111113e6;
        --gb: #26262a;
        --gon: #26262a;
        --gsh: 0 1px 2px #000;
        --b1: #0000;
        --b2: #0000;
        --b3: #0000;
      }
      /* 4. Spending chart, savings goal motion, and accessibility preferences */
      body {
        background: var(--bg);
      }
      nav button.on {
        background: var(--ac);
        color: var(--ac-t);
        box-shadow: none;
      }
      .sbtn {
        position: fixed;
        right: 16px;
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        z-index: 6;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        padding: 0;
        color: var(--tx);
        cursor: pointer;
        background: var(--gl);
        border: 1px solid var(--gb);
        box-shadow: var(--gsh);
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
      }
      :root {
        --bg: #fff;
        --card: #fff;
        --line: #0000001a;
        --gl: #ffffff8c;
        --gb: #0000001a;

        --rim: #0000002e;
        --rim2: #0000001a;
        --b1: #00000017;
        --b2: #00000010;

      }

        content: "";

      :root {
        --bg: #fff;
        --bgi: #fff;
        --card: #f5f5f7;
        --line: #e4e4e7;
        --gl: #f5f5f7;
        --gb: #e4e4e7;

        --gnav: #efeff1;

      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #000;

          --card: #121215;
          --line: #26262b;
          --gl: linear-gradient(160deg, #1a1a1f, #0e0e10);

          --gnav: #16161a;
          --gsh: none;
        }
      }
      :root[data-theme="dark"] {

        color: #4a90e2;
        pointer-events: none;

      }
      .ch.t .cl {
        background: #64b5f6;
        opacity: 1;
      }
      .xl span {
        position: absolute;
        top: 0;

      }
      .cc {

      }
      .cc.art {

      }

        left: 6%;
        bottom: 8.5%;

      }

        font-weight: 600;

      .pb {

      }
      .pb b {
        display: block;
        height: 100%;
        background: #fff;
        border-radius: 99px;
      }
      .pr {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        font-size: 2.3cqw;
        font-weight: 600;
        margin-top: 1.2cqw;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .cc .tr {
        position: absolute;
        top: 7%;
        right: 6%;
        font-size: 2.9cqw;
        font-weight: 600;
        letter-spacing: 0.08em;

      }
      #pop {
        position: fixed;
        inset: 0;
        background: #0006;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 40;
      }
      #pop.open {
        display: flex;
      }
      #pp {
        background: var(--card);
        border: 1px solid var(--gb);
        border-radius: 22px;
        padding: 14px;
        width: min(340px, 92vw);
        box-shadow: 0 20px 50px #0006;
      }
      .pc {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        text-align: center;
      }
      .pc span {
        font-size: 12px;
        color: var(--mut);
        padding: 4px 0;
      }
      .pc button {
        aspect-ratio: 1;
        border: 0;
        border-radius: 50%;
        background: none;
        color: var(--tx);
        font: inherit;
        cursor: pointer;
        padding: 0;
      }
      .pc button.on {
        background: var(--ac);
        color: var(--ac-t);
      }
      .pc button.td {
        box-shadow: inset 0 0 0 1px var(--mut);
      }
      .ap.s,
      .ap.u {
        background: #ffd60a26;
        border-left-color: #ffd60a;
      }
      .cc > div:first-child small {
        font-weight: 700;
        opacity: 1;
      }
      .cc .tr {
        font-weight: 700;
      }
      @keyframes goalInFromLeft {
        from {
          opacity: 0.25;
          transform: translateX(-36%) rotate(-7deg) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateX(0) rotate(0) scale(1);
        }
      }
      @keyframes goalInFromRight {
        from {
          opacity: 0.25;
          transform: translateX(36%) rotate(7deg) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateX(0) rotate(0) scale(1);
        }
      }
      @keyframes goalOutToLeft {
        to {
          opacity: 0;
          transform: translateX(-110%) rotate(-10deg) scale(0.94);
        }
      }
      @keyframes goalOutToRight {
        to {
          opacity: 0;
          transform: translateX(110%) rotate(10deg) scale(0.94);
        }
      }
      .goal-card.goal-in-left {
        animation: goalInFromLeft 0.32s cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }
      .goal-card.goal-in-right {
        animation: goalInFromRight 0.32s cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }
      .goal-card.goal-out-left {
        animation: goalOutToLeft 0.19s ease-in both;
      }
      .goal-card.goal-out-right {
        animation: goalOutToRight 0.19s ease-in both;
      }
      @media (prefers-reduced-motion: reduce) {
        .goal-card.goal-in-left,
        .goal-card.goal-in-right,
        .goal-card.goal-out-left,
        .goal-card.goal-out-right {
          animation-duration: 0.01ms;
        }
      }
      @keyframes spendDonutIn {
        from {
          opacity: 0.25;
          transform: rotate(-16deg) scale(0.9);
        }
        to {
          opacity: 1;
          transform: rotate(0) scale(1);
        }
      }
      @keyframes spendBarIn {
        from {
          transform: scaleY(0.04);
          opacity: 0.35;
        }
        to {
          transform: scaleY(1);
          opacity: 1;
        }
      }
      .spend-donut {
        animation: spendDonutIn 0.55s cubic-bezier(0.2, 0.75, 0.25, 1) both;
        transform-origin: center;
      }
      .spend-legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .spend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .spend-legend-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--tx);
      }
      .spend-legend-pct {
        font-weight: 700;
        color: var(--tx);
        min-width: 36px;
        text-align: right;
      }
      .spend-legend-amt {
        font-size: 12px;
        color: var(--mut);
        min-width: 78px;
        text-align: right;
      }
      .spend-insight {
        background: var(--gon);
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--g) 10%, var(--card));
        border-color: color-mix(in srgb, var(--g) 24%, var(--line));
        border-radius: 18px;
        padding: 14px 16px;
        margin: 12px 0;
      }
      .spend-bars {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 118px;
        padding: 8px 2px 0;
        border-bottom: 1px solid var(--line);
      }
      .spend-bar-col {
        display: flex;
        flex: 1;
        min-width: 0;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
      }
      .spend-bar {
        width: min(30px, 70%);
        min-height: 3px;
        border-radius: 7px 7px 3px 3px;
        background: #75a987;
        transform-origin: bottom;
        animation: spendBarIn 0.55s cubic-bezier(0.2, 0.75, 0.25, 1) both;
        animation-delay: var(--delay, 0ms);
      }
      .spend-bar.now {
        background: #214f3b;
      }
      .spend-month {
        font-size: 11px;
        color: var(--mut);
        white-space: nowrap;
      }
      .spend-total-label {
        font-size: 10px;
        color: var(--mut);
        white-space: nowrap;
      }
      .spend-overview {
        display: grid;
        grid-template-columns: minmax(148px, 0.9fr) minmax(0, 1.1fr);
        align-items: center;
        gap: 16px;
        margin-top: 8px;
      }
      .spend-donut-wrap {
        width: min(100%, 200px);
        aspect-ratio: 1;
        position: relative;
        margin: auto;
      }
      .spend-donut-wrap svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .spend-center {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        pointer-events: none;
      }
      .spend-center b {
        font-size: clamp(18px, 2.5vw, 25px);
        letter-spacing: -0.03em;
        color: var(--tx);
      }
      .spend-center span {
        font-size: 12px;
        color: var(--mut);
      }
      .spend-legend {
        min-width: 0;
      }
      @media (max-width: 700px) {
        .spend-overview {
          grid-template-columns: minmax(135px, 0.72fr) minmax(0, 1.28fr);
          gap: 10px;
        }
        .spend-donut-wrap {
          width: min(100%, 175px);
        }
        .spend-legend-row {
          gap: 6px;
          font-size: 12px;
        }
        .spend-legend-amt {
          min-width: 66px;
          font-size: 11px;
        }
      }
      @media (max-width: 430px) {
        .spend-overview {
          grid-template-columns: 1fr;
        }
        .spend-donut-wrap {
          width: 190px;
        }
        .spend-legend {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          column-gap: 14px;
        }
        .spend-legend-row {
          font-size: 11px;
        }
        .spend-legend-amt {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spend-donut,
        .spend-bar {
          animation-duration: 0.01ms;
          animation-delay: 0ms;
        }
      }
    .bl,.ci{width:1.35em;height:1.35em;vertical-align:-.3em;display:inline-block}.ci{object-fit:contain;border-radius:.3em}

.ch svg .gl{display:none}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

.pg{animation:pgIn .3s cubic-bezier(.2,.7,.2,1) backwards}

button,.pill,.btn,.rt,.aib,.row{transition:transform .15s ease,background-color .2s ease,opacity .2s ease,filter .2s ease}

function prefHtml(){return`<div class="eyebrow" style="margin:14px 0 6px">Currency</div><select onchange="setCur(this.value)">${Object.keys(CURS).map(k=>`<option value="${k}" ${(S.cur||'PHP')==k?'selected':''}>${k} (${CURS[k][0]})</option>`).join('')}</select><label style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><span>Show decimals (${CS()}2.00)</span><input type="checkbox" style="width:auto;margin:0" ${S.dec?'checked':''} onchange="S.dec=this.checked?1:0;render();openSettings()"></label><p class="m" style="font-size:12px">Display only — your saved amounts are never converted.</p>`}
function setCur(v){S.cur=v;render();openSettings()}
const hasPre=()=>{try{return!!localStorage.getItem('pera_pre')}catch(e){return false}};
function dataHtml(){return`<div class="eyebrow" style="margin:14px 0 6px">Data backup</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn s" onclick="expJSON()">Export backup (JSON)</button><button class="btn s" onclick="expCSV()">Export transactions (CSV)</button></div><input id="imf" type="file" accept=".json,.csv,application/json,text/csv" style="margin-top:8px" onchange="impRead(this)"><p class="m" style="font-size:12px">Import a JSON backup or a transactions CSV. You’ll see a preview and confirm before anything changes.</p>${hasPre()?'<button class="btn s" onclick="sure(this,impUndo)">Undo last import</button>':''}`}
function dl(n,t,m){const u=URL.createObjectURL(new Blob([t],{type:m})),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function expJSON(){dl(`cap-financetracker-backup-${today}.json`,JSON.stringify({app:'cap-finance-tracker',version:'1.01',exported:new Date().toISOString(),data:S},null,1),'application/json');toast('Backup exported')}
const q2=v=>{v=String(v==null?'':v);return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function expCSV(){const rows=[...S.tx.map(t=>[t,'posted']),...S.pend.map(t=>[t,'pending'])].sort((a,b)=>a[0].d.localeCompare(b[0].d)).map(([t,s])=>{const a=acct(t.acct);return[t.id,t.d,t.pd||'',t.amt<0?'expense':'income',s,t.amt,t.cat,a.name,a.type||'',t.note||''].map(q2).join(',')});dl(`cap-financetracker-transactions-${today}.csv`,'\ufeff'+['id,date,posting_date,type,status,amount,category,account,account_type,description',...rows].join('\r\n'),'text/csv');toast('Transactions exported')}
function csvP(t){t=t.replace(/^\ufeff/,'');const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==','){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))R.push(r);r=[]}else c+=h}r.push(c);if(r.some(x=>x!==''))R.push(r);return R}
const sig=t=>[t.d,Math.round(t.amt*100),t.acct,(t.note||'').trim().toLowerCase()].join('|'),DRE=/^\d{4}-\d{2}-\d{2}$/;let IMP=null;
function csvPlan(txt){const R=csvP(txt);if(R.length<2)throw Error('The CSV has no data rows.');const H=R[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,'_')),ix=n=>H.indexOf(n);if(ix('date')<0||ix('amount')<0)throw Error('The CSV needs at least “date” and “amount” columns.');
const g=(r,n)=>{const i=ix(n);return i<0?'':String(r[i]||'').trim()},seen=new Set([...S.tx,...S.pend].map(sig)),ids=new Set([...S.tx,...S.pend].map(t=>String(t.id))),ok=[],bad=[];let dup=0;
R.slice(1).forEach((r,n)=>{const ln=n+2,d=g(r,'date'),ty=g(r,'type').toLowerCase();let amt=+g(r,'amount').replace(/[^\d.\-]/g,'');const an=g(r,'account').toLowerCase(),a=S.accts.find(x=>String(x.id)==g(r,'account_id')||x.name.toLowerCase()==an);let e=null;
if(!DRE.test(d)||isNaN(new Date(d+'T00:00:00')))e='invalid date (use YYYY-MM-DD)';else if(!Number.isFinite(amt)||!amt)e='invalid amount';else if(!a)e='unknown account “'+g(r,'account')+'”';if(e){bad.push(`Row ${ln}: ${e}`);return}
if(ty=='expense'&&amt>0)amt=-amt;if(ty=='income'&&amt<0)amt=-amt;const cat=g(r,'category'),pd=g(r,'posting_date'),st=g(r,'status').toLowerCase()=='pending'&&a.type=='credit'?'pending':'posted',t={id:uid(),d,amt,cat:CATS[cat]?cat:'Other',acct:a.id,note:g(r,'description')||g(r,'note')};
if(st=='posted'&&a.type=='credit'&&DRE.test(pd)&&pd>=d)t.pd=pd;const oid=g(r,'id');if(seen.has(sig(t))||(oid&&ids.has(oid))){dup++;return}seen.add(sig(t));ok.push({t,st})});return{kind:'csv',ok,dup,bad}}
function jsonPlan(txt){const o=JSON.parse(txt),d=o&&o.data&&o.data.accts?o.data:o,E=[];if(!d||!Array.isArray(d.accts)||!Array.isArray(d.tx))throw Error('This isn’t a Cap backup: accounts or transactions are missing.');const N=x=>typeof x=='number'&&isFinite(x),ids=new Set();
d.accts.forEach((a,i)=>{if(!a||!N(a.id)||typeof a.name!='string'||!['debit','credit','ewallet'].includes(a.type)||!Number.isFinite(+a.bal))E.push('Account #'+(i+1)+' is invalid');else ids.add(a.id)});
const pend=Array.isArray(d.pend)?d.pend:[];[...d.tx,...pend].forEach((t,i)=>{if(!t||!N(t.id)||!DRE.test(t.d||'')||!N(t.amt)||!ids.has(t.acct))E.push('Transaction #'+(i+1)+' is invalid or uses an unknown account')});
['bills','goals','debts','xfer'].forEach(k=>{if(d[k]!=null&&!Array.isArray(d[k]))E.push(k+' must be a list')});if(E.length)throw Error(E.slice(0,5).join('\n')+(E.length>5?`\n…and ${E.length-5} more`:''));
return{kind:'json',d:{...d,pend,xfer:d.xfer||[],bills:d.bills||[],goals:d.goals||[],debts:d.debts||[],budgets:d.budgets||{}}}}
function mergeCount(d){const have=new Set([...S.tx,...S.pend].map(t=>t.id)),sg=new Set([...S.tx,...S.pend].map(sig)),old=new Set(S.accts.map(a=>a.id)),nw=k=>d[k].filter(x=>!(S[k]||[]).some(y=>y.id==x.id)).length;return{a:d.accts.filter(a=>!old.has(a.id)).length,t:[...d.tx,...d.pend].filter(t=>!have.has(t.id)&&!sg.has(sig(t))).length,b:nw('bills'),g:nw('goals'),db:nw('debts')}}
function impRead(inp){const f=inp.files[0];if(!f)return;if(f.size>25e6)return toast('That file is too large');openS('<p class="m"><span class="spin"></span> Reading file…</p>');const r=new FileReader();r.onerror=()=>{closeS();toast('Could not read the file')};
r.onload=()=>{try{const t=String(r.result);IMP=/\.csv$/i.test(f.name)||!/^\s*[\[{]/.test(t)?csvPlan(t):jsonPlan(t);impPrev()}catch(e){IMP=null;openS(`<h2>Can’t import this file</h2><p class="r" style="white-space:pre-wrap">${esc(e.message)}</p><p class="m">Nothing was changed.</p><button class="btn s" onclick="closeS()">Close</button>`)}};r.readAsText(f)}
function impPrev(){const I=IMP;let h;if(I.kind=='csv')h=`<h2>Import transactions</h2><p><b>${I.ok.length}</b> new · ${I.dup} duplicate${I.dup==1?'':'s'} skipped · ${I.bad.length} invalid</p>${I.bad.length?`<div class="card r" style="font-size:12px;white-space:pre-wrap">${esc(I.bad.slice(0,5).join('\n'))}${I.bad.length>5?`\n…and ${I.bad.length-5} more (skipped)`:''}</div>`:''}${I.ok.slice(0,4).map(x=>`<div class="row"><div class="f">${esc(x.t.note||x.t.cat)}<small>${x.t.d} · ${esc(acct(x.t.acct).name)}${x.st=='pending'?' · pending':''}</small></div><b class="${x.t.amt>0?'g':'r'}">${php(x.t.amt)}</b></div>`).join('')}<label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input id="adj" type="checkbox" checked style="width:auto;margin:0"> Apply posted rows to account balances</label>`;
else{const d=I.d,m=mergeCount(d);h=`<h2>Restore backup</h2><p class="m">File: ${d.accts.length} accounts · ${d.tx.length+d.pend.length} transactions · ${d.bills.length} bills · ${d.goals.length} goals · ${d.debts.length} debts</p><select id="imm"><option value="merge">Merge — add only what’s new (${m.a} accounts, ${m.t} transactions, ${m.b+m.g+m.db} bills/goals/debts)</option><option value="replace">Replace everything currently in the app</option></select><p class="m" style="font-size:12px">Merge skips duplicates and keeps your current balances. Replace swaps all current data (${S.accts.length} accounts, ${S.tx.length} transactions) for the file’s. A restore point is saved first.</p>`}
openS(h+`<button class="btn" ${I.kind=='csv'&&!I.ok.length?'disabled':''} onclick="impApply()">Confirm import</button> <button class="btn s" onclick="IMP=null;closeS()">Cancel</button>`)}
function impApply(){const I=IMP;if(!I)return;const snap=JSON.stringify(S);let n=0;try{
if(I.kind=='csv'){const adj=$('#adj').checked;I.ok.forEach(({t,st})=>{(st=='pending'?S.pend:S.tx).push(t);if(st!='pending'&&adj)bApply(t,1)});n=I.ok.length}
else if($('#imm').value=='replace'){S=JSON.parse(JSON.stringify(I.d));n=S.tx.length}
else{const d=I.d,have=new Set([...S.tx,...S.pend].map(t=>t.id)),sg=new Set([...S.tx,...S.pend].map(sig)),old=new Set(S.accts.map(a=>a.id));d.accts.forEach(a=>{if(!old.has(a.id))S.accts.push(a)});
[...d.tx.map(t=>[t,0]),...d.pend.map(t=>[t,1])].forEach(([t,p])=>{if(have.has(t.id)||sg.has(sig(t)))return;(p?S.pend:S.tx).push(t);if(!p&&old.has(t.acct))bApply(t,1);n++});
['bills','goals','debts'].forEach(k=>{S[k]=S[k]||[];d[k].forEach(x=>{if(!S[k].some(y=>y.id==x.id))S[k].push(x)})});d.xfer.forEach(x=>{if(!old.has(x.to)&&!S.xfer.some(y=>y.id==x.id))S.xfer.push(x)});Object.keys(d.budgets).forEach(k=>{if(S.budgets[k]==null)S.budgets[k]=d.budgets[k]})}
try{localStorage.setItem('pera_pre',snap)}catch(e){}IMP=null;closeS();render();toast(n+' record'+(n==1?'':'s')+' imported')}catch(e){S=JSON.parse(snap);IMP=null;save();render();toast('Import failed — your data was not changed')}}
function impUndo(){try{S=JSON.parse(localStorage.getItem('pera_pre'));localStorage.removeItem('pera_pre');render();openSettings();toast('Restored the data from before the last import')}catch(e){toast('Nothing to restore')}}
      render();
      if (typeof claude != "undefined") dbInit();
